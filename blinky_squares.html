<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinky Squares</title>
    <style>
        #squares-grid {
            display: grid;
            grid-template-columns: repeat(100, 1fr); 
            grid-gap: 1px;
            width: 1000px;
            height: 1000px;
        }

        .square {
            width: 100%;
            height: 100%;
            
            animation-name: fade;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in-out;
        }

        @keyframes fade {
            0% { opacity: 0; }
            50% { opacity: 0.75; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="squares-grid"></div>

    <script>
        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
        const blinkSpeeds = [0.5, 1, 1.5, 2, 2.5];

        function getRandomColor(colors) {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        const container = document.getElementById('squares-grid');

        for (let i = 0; i < 10000; i++) {
            const square = document.createElement('div');
            square.classList.add('square');
            square.style.backgroundColor = getRandomColor(colors);
            
            const randomSpeed = blinkSpeeds[Math.floor(Math.random() * blinkSpeeds.length)];
            square.style.animationDuration = `${randomSpeed}s`;
            square.style.animationDelay = `${Math.random() * 2}s`;

            container.appendChild(square);
        }
    </script>
</body>
</html>
