<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinky Squares</title>
    <style>
        #main-header {
            width: 100%;
            max-width: 2048px;
            text-align: left;
            margin: 0px auto;
            padding: 0px 20px;
        }

        #squares-grid {
            display: grid;
            grid-template-columns: repeat(100, 1fr); 
            grid-gap: 1px;
            width: 1000px;
            height: 1000px;
        }

        .square {
            width: 100%;
            height: 100%;
            
            animation-name: fade;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in-out;
        }

        @keyframes fade {
            0% { opacity: 0; }
            50% { opacity: 0.75; }
            100% { opacity: 1; }
        }

        .container {
            display: flex;
            align-items: top;
            justify-content: left;
            max-width: 2048px;
            width: 100%;
            margin: 0px auto;
            padding: 0px 20px;
        }

        #grid-container {
            width: 80%;
            max-width: 1800px;
            display: flex;
            align-items: top;
            justify-content: left;
            overflow: scroll;
        }

        #control-panel {
            max-width: 450px;
            min-height: 800px;
            width: 15%;
            display: inline;
            background-color: #eee;
            margin-right: 20px;
            padding: 10px;
            border: 2px solid #777;
        }

        #control-panel h2 {
            margin-top: 5px;
            padding-top: 0px;
        }

        #control-panel label {
            display: block;
            padding-bottom: 10px;
        }

        #control-panel input {
            margin-left: 5px;
        }

    </style>
</head>
<body>
    <header id="main-header">
        <h1>Blinky Squares</h1>
    </header>
    <section class="container">
        <aside id="control-panel">
            <h2>Control Panel</h2>
                <label>
                    Grid Width:
                    <input type="number" id="gridWidth" min="10" max="200" value="100">
                </label>
                <label>
                    Grid Height:
                    <input type="number" id="gridHeight" min="10" max="200" value="100">
                </label>
                <label>
                    Cell Size:
                    <input type="number" id="cellSize" min="5" max="20" value="10">
                </label>
        </aside>
        <div id="grid-container">
            <div id="squares-grid"></div>
        </div>
    </section>
    <script>
        let gridConfig = {
            colors: ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'],
            blinkSpeeds: [0.5, 1, 1.5, 2, 2.5],
            width: 100,
            height: 100,
            cellSize: 10,
        };

        function getRandomColor(colors) {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function drawGrid(
            gridConfig,
        ) {
            const container = document.getElementById('squares-grid');
            container.innerHTML = '';
            container.style.gridTemplateColumns =
                `repeat(${gridConfig.width}, ${gridConfig.cellSize}px)`;
            container.style.width = `${gridConfig.width * gridConfig.cellSize}px`;
            container.style.height = `${gridConfig.height * gridConfig.cellSize}px`;

            for (let i = 0; i < gridConfig.width * gridConfig.height; i++) {
                const square = document.createElement('div');
                square.classList.add('square');
                square.style.backgroundColor = getRandomColor(gridConfig.colors);
                
                const randomSpeed = gridConfig.blinkSpeeds[Math.floor(Math.random() * gridConfig.blinkSpeeds.length)];
                square.style.animationDuration = `${randomSpeed}s`;
                square.style.animationDelay = `${Math.random() * 2}s`;

                container.appendChild(square);
            }
        }

        drawGrid(
            gridConfig
        )

        document.getElementById('gridWidth').addEventListener('change', (e) => {
            gridConfig.width = parseInt(e.target.value);
            drawGrid(gridConfig);
        });

        document.getElementById('gridHeight').addEventListener('change', (e) => {
            gridConfig.height = parseInt(e.target.value);
            drawGrid(gridConfig);
        });

        document.getElementById('cellSize').addEventListener('change', (e) => {
            gridConfig.cellSize = parseInt(e.target.value);
            drawGrid(gridConfig);
        });
    </script>
</body>
</html>
